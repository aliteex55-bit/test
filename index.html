<!DOCTYPE html>
<html lang="sv" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holiday Maker – se hur programmet fungerar</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/theme.css?v=b163392692">
<link rel="stylesheet" href="css/layout.css?v=c49f9c3c19">
<link rel="stylesheet" href="css/components.css?v=6d29f33ba3">
</head>
<body>
<header>
  <h1>Holiday Maker</h1>
  <div class="modes" role="group" aria-label="Läge">
    <button type="button" class="modebtn" data-mode="utforska" aria-pressed="false" title="Klicka runt själv: en ruta, en tabell, en kodrad eller ett rum">Utforska</button>
    <button type="button" class="modebtn" data-mode="berattelse" aria-pressed="true" title="Programmet berättas steg för steg, och vyerna följer med">Berättelsen</button>
  </div>
  <div class="transport" id="transport" role="group" aria-label="Berättelsen">
    <button type="button" id="storyprev" title="Föregående scen (←)" aria-label="Föregående scen">⏮</button>
    <button type="button" id="storyplay" title="Spela eller pausa (mellanslag)" aria-label="Spela" aria-pressed="false">▶</button>
    <button type="button" id="storynext" title="Nästa scen (→)" aria-label="Nästa scen">⏭</button>
    <span class="sceneno" id="sceneno">1 / 1</span>
    <span class="scenecap" id="scenecap" aria-live="polite"></span>
  </div>
  <details class="laymenu" id="laymenu"><summary title="Färdiga layouter och vilka vyer som visas">Layout ▾</summary><div class="laypop" id="laypop"></div></details>
  <div class="textsize" role="group" aria-label="Textstorlek" title="Textstorlek"><button type="button" id="textminus" aria-label="Mindre text">A−</button><span id="textval">100 %</span><button type="button" id="textplus" aria-label="Större text">A+</button></div>
  <button type="button" class="fullbtn" id="fullbtn" aria-pressed="false" aria-label="Helskärm" title="Hela sidan i helskärm (Esc avslutar)">⛶</button>
  <button type="button" id="theme" title="Ljust eller mörkt tema" aria-label="Ljust eller mörkt tema">◐</button>
</header>
<main id="panes">
  <section class="pane" data-pane="panel" id="pane-panel" aria-label="Förklaring"><div class="panebody" id="body-panel" aria-live="polite"></div></section>
  <section class="pane" data-pane="er" id="pane-er" aria-label="Databasen"><div class="panebody" id="body-er"></div></section>
  <section class="pane" data-pane="flow" id="pane-flow" aria-label="Flöde"><div class="panebody" id="body-flow"></div></section>
  <section class="pane" data-pane="cal" id="pane-cal" aria-label="December-kalendern"><div class="panebody" id="body-cal"></div></section>
  <section class="pane" data-pane="code" id="pane-code" aria-label="Koden"><div class="panebody" id="body-code"></div></section>
  <section class="pane" data-pane="sql" id="pane-sql" aria-label="SQL-konsolen"><div class="panebody" id="body-sql"></div></section>
</main>
<script src="js/data.js?v=d3ca8d1af9"></script>
<script src="js/core.js?v=1b0db35ed3"></script>
<script src="js/db.js?v=6d6d8c29f8"></script>
<script src="js/layout.js?v=32f625f236"></script>
<script src="js/draw.js?v=3f26e02f9c"></script>
<script src="js/flow.js?v=24d7e7fc34"></script>
<script src="js/er.js?v=3e2992d6a8"></script>
<script src="js/code.js?v=fbc1a7621d"></script>
<script src="js/panel.js?v=6f3277b0e4"></script>
<script src="js/calendar.js?v=e115f5088e"></script>
<script src="js/sqlconsole.js?v=d46c50c1e4"></script>
<script src="js/story.js?v=793ff707de"></script>
<script src="js/app.js?v=f2151cd04b"></script>
</body>
</html>
